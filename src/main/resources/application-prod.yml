spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false

server:
  # За FastPanel-nginx (или любым reverse proxy). Заставляет Spring доверять
  # X-Forwarded-Proto/Host/For — иначе HTTP→HTTPS redirect Spring Security
  # отдаёт на http://, а не https://, и браузер делает лишний прыжок.
  forward-headers-strategy: NATIVE
logging:
  level:
    ru.village: INFO

app:
  security:
    admin-password: ${APP_SECURITY_ADMIN_PASSWORD}
    operator-password: ${APP_SECURITY_OPERATOR_PASSWORD}
    user-password: ${APP_SECURITY_USER_PASSWORD}
