<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Village</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/village.css}"/>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-light bg-light mb-3">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🏠 Village</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/payments}">Поступления</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/expenses}">Расходы</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/history}">История</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                    <a class="nav-link" th:href="@{/admin/payment/new}">+ Приход</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                    <a class="nav-link" th:href="@{/admin/expense/new}">+ Расход</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                    <a class="nav-link" th:href="@{/admin/events}">События</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/contacts}">Контакты</a>
                </li>
            </ul>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-flex align-items-center">
                <span class="navbar-text me-2" sec:authentication="name"></span>
                <button class="btn btn-sm btn-outline-secondary">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="mt-5 py-3 text-center text-muted">
    <small>Village — учёт сборов на нашей улице</small>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
