<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${(brand ?: 'Village') + (#strings.isEmpty(title) ? '' : ' — ' + title)}">Village</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Spectral:wght@500;600;700&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/village.css}"/>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-md village-navbar mb-4"
     th:with="uri=${currentUri} ?: ''">
    <div class="container">
        <a class="navbar-brand village-brand" th:href="@{/}">
            <span class="village-brand__mark">🏡</span>
            <span class="village-brand__text" th:text="${brand} ?: 'Village'">Village</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto nav-btns">
                <li class="nav-item">
                    <a class="nav-btn nav-btn--user" th:href="@{/}"
                       th:classappend="${uri == '/'} ? 'active'">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-btn nav-btn--user" th:href="@{/payments}"
                       th:classappend="${#strings.startsWith(uri, '/payments')} ? 'active'">Поступления</a>
                </li>
                <li class="nav-item">
                    <a class="nav-btn nav-btn--user" th:href="@{/expenses}"
                       th:classappend="${#strings.startsWith(uri, '/expenses')} ? 'active'">Расходы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-btn nav-btn--user" th:href="@{/history}"
                       th:classappend="${#strings.startsWith(uri, '/history')} ? 'active'">История</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
                    <a class="nav-btn nav-btn--op" th:href="@{/admin/events}"
                       th:classappend="${#strings.startsWith(uri, '/admin/events')} ? 'active'">События</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-btn nav-btn--admin" th:href="@{/admin/addresses}"
                       th:classappend="${#strings.startsWith(uri, '/admin/addresses')} ? 'active'">Адреса</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-btn nav-btn--admin" th:href="@{/admin/contacts}"
                       th:classappend="${#strings.startsWith(uri, '/admin/contacts')} ? 'active'">Полезные контакты</a>
                </li>
            </ul>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-flex align-items-center">
                <span class="navbar-text me-2" sec:authentication="name"></span>
                <button class="btn btn-sm btn-outline-secondary">Выйти</button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="village-footer mt-5 py-4 text-center">
    <span class="village-footer__leaf">🌿</span>
    <small th:text="${tagline} ?: 'Village — учёт сборов на нашей улице'">Village — учёт сборов на нашей улице</small>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Счётчик посещений: задаётся в application-prod.yml (app.branding.counter). -->
    <div th:if="${!#strings.isEmpty(counter)}" th:utext="${counter}"></div>
</footer>

</body>
</html>
