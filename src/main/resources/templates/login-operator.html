<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Village — вход для оператора')}"></head>
<body>
<div class="container" style="max-width: 420px;">
    <h1 class="my-4 text-center">Вход для оператора</h1>

    <div th:if="${param.error}" class="alert alert-danger">Неверный логин или пароль</div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>

    <p class="text-center mt-3">
        <a class="small text-muted" th:href="@{/welcome}">← Вход для жителей</a>
    </p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
