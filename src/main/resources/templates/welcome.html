<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body>
<div class="container" style="max-width: 420px;">
    <h1 class="my-4 text-center" th:text="${brand} ?: 'Village'">Village</h1>

    <div th:if="${param.error}" class="alert alert-danger">Неверный пароль</div>
    <div th:if="${param.logout}" class="alert alert-success">Вы вышли из системы</div>

    <div class="card auth-card">
        <div class="card-body">
            <form th:action="@{/login}" method="post">
                <input type="hidden" name="username" value="user"/>
                <div class="mb-3">
                    <label class="form-label">Пароль доступа</label>
                    <input type="password" name="password" class="form-control" required autofocus/>
                </div>
                <button type="submit" class="btn btn-success w-100">Войти</button>
            </form>
        </div>
    </div>

    <p class="text-center mt-3">
        <a class="small text-muted" th:href="@{/login-operator}">Вход для оператора →</a>
    </p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
