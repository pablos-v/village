<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Village</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<h1>Village — сборы на нашей улице</h1>

<section>
    <h2>Остаток: <span th:text="${balance}">0</span> ₽</h2>
</section>

<section>
    <h3>Последние поступления</h3>
    <ul>
        <li th:each="p : ${recentPayments}">
            <span th:text="${p.date}"></span> —
            <span th:text="${p.address}"></span> —
            <span th:text="${p.amount}"></span> ₽
        </li>
    </ul>
</section>

<section>
    <h3>Последние расходы</h3>
    <ul>
        <li th:each="e : ${recentExpenses}">
            <span th:text="${e.date}"></span> —
            <span th:text="${e.comment}"></span> —
            <span th:text="${e.amount}"></span> ₽
        </li>
    </ul>
</section>

<section th:if="${!contacts.isEmpty()}">
    <h3>Полезная информация</h3>
    <ul>
        <li th:each="c : ${contacts}">
            <strong th:text="${c.type}"></strong>:
            <span th:text="${c.contactInfo}"></span>
            <em th:if="${c.comment}" th:text="${'(' + c.comment + ')'}"></em>
        </li>
    </ul>
</section>

<section>
    <h3>AI-ассистент</h3>
    <textarea id="ai-input" rows="2" cols="60" placeholder="Например: какой остаток? кто сдал больше всех?"></textarea>
    <br/>
    <button id="ai-send">Спросить</button>
    <div id="ai-history" style="margin-top: 1em;"></div>
</section>
<script th:src="@{/js/ai-chat.js}" defer></script>

<p><a th:href="@{/payments}">Все поступления</a> · <a th:href="@{/expenses}">Все расходы</a> · <a th:href="@{/history}">История</a></p>

<form th:action="@{/logout}" method="post"><button>Выйти</button></form>
</body>
</html>
