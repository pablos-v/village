<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Расходы')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="mb-0">Все расходы</h1>
        <a sec:authorize="hasAnyRole('OPERATOR','ADMIN')" class="btn btn-success btn-lg fw-bold"
           th:href="@{/admin/expense/new}">➕ ДОБАВИТЬ</a>
    </div>

    <p class="text-muted small" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
        Нажмите на запись, чтобы изменить её.
    </p>

    <div class="table-responsive">
        <table class="table table-striped table-hover"
               th:with="canEdit=${#authorization.expression('hasAnyRole(''OPERATOR'',''ADMIN'')')}">
            <thead>
            <tr><th>Дата</th><th>Комментарий</th><th>Событие</th><th class="text-end">Сумма</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${expenses.content}"
                th:classappend="${canEdit} ? 'clickable-row'"
                th:attr="data-href=${canEdit} ? @{/admin/expense/{id}/edit(id=${e.id})} : null">
                <td th:text="${#temporals.format(e.date, 'dd.MM.yyyy')}"></td>
                <td th:text="${e.comment}"></td>
                <td th:text="${e.eventName}"></td>
                <td class="text-end text-danger fw-bold" th:text="${#numbers.formatInteger(e.amount, 1, 'NONE')} + ' ₽'"></td>
            </tr>
            <tr th:if="${expenses.isEmpty()}"><td colspan="4" class="text-muted text-center">Ничего не найдено</td></tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${expenses.totalPages > 1}" aria-label="Постраничная навигация" class="mt-3">
        <ul class="pagination pagination-lg justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${expenses.first} ? 'disabled'">
                <a class="page-link" th:href="@{/expenses(page=${expenses.number - 1})}">← Назад</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, expenses.number - 2), T(java.lang.Math).min(expenses.totalPages - 1, expenses.number + 2))}"
                th:classappend="${i == expenses.number} ? 'active'">
                <a class="page-link" th:href="@{/expenses(page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${expenses.last} ? 'disabled'">
                <a class="page-link" th:href="@{/expenses(page=${expenses.number + 1})}">Вперёд →</a>
            </li>
        </ul>
        <p class="text-center text-muted small mb-0">
            Страница <span th:text="${expenses.number + 1}"></span> из <span th:text="${expenses.totalPages}"></span>
        </p>
    </nav>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/clickable-rows.js}" defer></script>
</body>
</html>
