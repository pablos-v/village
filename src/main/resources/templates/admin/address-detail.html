<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Жители')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 720px;">
    <p class="mb-1">
        <a class="small text-muted" th:href="@{/admin/addresses}">← К списку адресов</a>
    </p>
    <h1 class="mb-3">Жители — <span th:text="${household.address}"></span></h1>

    <p class="text-muted" th:if="${household.inhabitants.isEmpty()}">Пока нет жителей</p>

    <div class="vstack gap-2 mb-4">
        <div class="d-flex align-items-end gap-2 flex-wrap border-bottom pb-2"
             th:each="i : ${household.inhabitants}">
            <form th:action="@{/admin/addresses/{id}/inhabitants/{iid}(id=${household.id}, iid=${i.id})}" method="post"
                  class="d-flex align-items-end gap-2 flex-wrap flex-grow-1">
                <div class="flex-grow-1">
                    <label class="form-label small mb-0">Имя</label>
                    <input type="text" name="name" class="form-control form-control-sm" th:value="${i.name}" maxlength="255" required/>
                </div>
                <div>
                    <label class="form-label small mb-0">Телефон</label>
                    <input type="text" name="phone" class="form-control form-control-sm" th:value="${i.phone}" maxlength="50"/>
                </div>
                <div class="form-check mb-2">
                    <input type="checkbox" name="master" value="true" class="form-check-input" th:checked="${i.master}" th:id="'m' + ${i.id}"/>
                    <label class="form-check-label small" th:for="'m' + ${i.id}">Контактный</label>
                </div>
                <button class="btn btn-sm btn-outline-success mb-2">Сохранить</button>
            </form>
            <form th:action="@{/admin/addresses/{id}/inhabitants/{iid}/delete(id=${household.id}, iid=${i.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger mb-2" onclick="return confirm('Удалить жителя?')">Удалить</button>
            </form>
        </div>
    </div>

    <h2 class="h5 mt-4 mb-3">Добавить жителя</h2>
    <form th:action="@{/admin/addresses/{id}/inhabitants(id=${household.id})}" th:object="${inhabitantForm}" method="post"
          class="row g-2 align-items-end">
        <div class="col-12 col-sm">
            <label class="form-label">Имя</label>
            <input type="text" th:field="*{name}" class="form-control" maxlength="255"/>
            <div class="text-danger small" th:errors="*{name}"></div>
        </div>
        <div class="col-12 col-sm">
            <label class="form-label">Телефон</label>
            <input type="text" th:field="*{phone}" class="form-control" maxlength="50"/>
        </div>
        <div class="col-auto">
            <div class="form-check">
                <input type="checkbox" th:field="*{master}" class="form-check-input" id="master-new"/>
                <label class="form-check-label" for="master-new">Контактный</label>
            </div>
        </div>
        <div class="col-auto">
            <button class="btn btn-success">Добавить</button>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
