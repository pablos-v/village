<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('События')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="mb-3">События (на что собираем)</h1>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr><th>Название</th><th class="text-end">Ожидаемая сумма</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${events}">
                <td th:text="${e.name}"></td>
                <td class="text-end" th:text="${e.cost != null} ? (${#numbers.formatInteger(e.cost, 1, 'NONE')} + ' ₽') : '—'"></td>
            </tr>
            <tr th:if="${events.isEmpty()}"><td colspan="2" class="text-muted text-center">Пока нет событий</td></tr>
            </tbody>
        </table>
    </div>

    <a class="btn btn-success" th:href="@{/admin/events/new}">+ Новое событие</a>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
