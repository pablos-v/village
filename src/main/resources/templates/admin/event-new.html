<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Новое событие</title>
</head>
<body>
<h1>Новое событие</h1>

<form th:action="@{/admin/events}" th:object="${form}" method="post">
    <div>
        <label>Название: <input type="text" th:field="*{name}"/></label>
        <span th:errors="*{name}" style="color:red;"></span>
    </div>
    <div>
        <label>Сумма: <input type="number" step="0.01" th:field="*{cost}"/></label>
        <span th:errors="*{cost}" style="color:red;"></span>
    </div>
    <button>Сохранить</button>
</form>

<p><a th:href="@{/admin/events}">← Назад</a></p>
</body>
</html>
