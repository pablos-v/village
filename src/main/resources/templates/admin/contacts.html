<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Контакты')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="mb-3">Полезная информация — управление</h1>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr><th>Тип</th><th>Контакт</th><th>Примечание</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${contacts}">
                <td th:text="${c.type}"></td>
                <td th:utext="${c.contactInfoHtml}"></td>
                <td th:text="${c.comment}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-success" th:href="@{'/admin/contacts/' + ${c.id} + '/edit'}">Изменить</a>
                    <form th:action="@{'/admin/contacts/' + ${c.id} + '/delete'}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить?')">Удалить</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${contacts.isEmpty()}"><td colspan="4" class="text-muted text-center">Пока нет контактов</td></tr>
            </tbody>
        </table>
    </div>

    <a class="btn btn-success" th:href="@{/admin/contacts/new}">+ Новый контакт</a>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
