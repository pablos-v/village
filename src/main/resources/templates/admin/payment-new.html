<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Новый приход</title>
    <script th:src="@{/js/address-autocomplete.js}" defer></script>
</head>
<body>
<h1>Внести приход</h1>

<form th:action="@{/admin/payment}" th:object="${form}" method="post">
    <div>
        <label>Событие:</label>
        <select th:field="*{eventId}">
            <option th:each="e : ${events}" th:value="${e.id}"
                    th:text="${e.name + ' (' + e.cost + ' ₽)'}"></option>
        </select>
        <span th:errors="*{eventId}" style="color:red;"></span>
    </div>

    <div>
        <label>Адрес:</label>
        <input type="text" id="address-search" placeholder="Начните вводить улицу..." autocomplete="off"/>
        <input type="hidden" th:field="*{householdId}" id="household-id"/>
        <ul id="address-suggestions"></ul>
        <span th:errors="*{householdId}" style="color:red;"></span>
    </div>

    <div>
        <label>Сумма: <input type="number" step="0.01" th:field="*{amount}"/></label>
        <span th:errors="*{amount}" style="color:red;"></span>
    </div>

    <div>
        <label>Дата: <input type="date" th:field="*{date}"/></label>
        <span th:errors="*{date}" style="color:red;"></span>
    </div>

    <button>Сохранить</button>
</form>

<p><a th:href="@{/}">← Назад на главную</a></p>
</body>
</html>
