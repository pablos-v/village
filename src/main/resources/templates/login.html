<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Village — вход</title>
</head>
<body>
<h1>Village — вход в систему</h1>

<div th:if="${param.error}" style="color:red;">Неверный логин или пароль</div>
<div th:if="${param.logout}" style="color:green;">Вы вышли из системы</div>

<form th:action="@{/login}" method="post">
    <div>
        <label>Логин: <input type="text" name="username" required/></label>
    </div>
    <div>
        <label>Пароль: <input type="password" name="password" required/></label>
    </div>
    <div>
        <button type="submit">Войти</button>
    </div>
</form>
</body>
</html>
