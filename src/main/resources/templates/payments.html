<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Поступления')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="mb-0">Все поступления</h1>
        <a sec:authorize="hasAnyRole('OPERATOR','ADMIN')" class="btn btn-success btn-lg fw-bold"
           th:href="@{/admin/payment/new}">➕ ДОБАВИТЬ</a>
    </div>

    <form method="get" th:action="@{/payments}" class="row g-2 align-items-end mb-3">
        <div class="col-auto">
            <label class="form-label">Год</label>
            <select name="year" class="form-select" onchange="this.form.submit()">
                <option value="" th:text="'Все годы'" th:selected="${year == null}"></option>
                <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                        th:selected="${y == year}"></option>
            </select>
        </div>
        <div class="col-auto">
            <label class="form-label">Месяц</label>
            <select name="month" class="form-select" onchange="this.form.submit()">
                <option value="" th:text="'Все месяцы'" th:selected="${month == null}"></option>
                <option th:each="m : ${months}" th:value="${m.key}" th:text="${m.value}"
                        th:selected="${m.key == month}"></option>
            </select>
        </div>
        <div class="col-auto" th:if="${year != null or month != null}">
            <label class="form-label d-block">&nbsp;</label>
            <a class="btn btn-outline-secondary" th:href="@{/payments}">Сбросить</a>
        </div>
    </form>

    <p class="text-muted small" sec:authorize="hasAnyRole('OPERATOR','ADMIN')">
        Нажмите на запись, чтобы изменить её.
    </p>

    <div class="table-responsive">
        <table class="table table-striped table-hover"
               th:with="canEdit=${#authorization.expression('hasAnyRole(''OPERATOR'',''ADMIN'')')}">
            <thead>
            <tr><th>Дата</th><th>Адрес</th><th>Событие</th><th class="text-end">Сумма</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${payments.content}"
                th:classappend="${canEdit} ? 'clickable-row'"
                th:attr="data-href=${canEdit} ? @{/admin/payment/{id}/edit(id=${p.id})} : null">
                <td th:text="${#temporals.format(p.date, 'dd.MM.yyyy')}"></td>
                <td th:text="${p.address}"></td>
                <td th:text="${p.eventName}"></td>
                <td class="text-end text-success fw-bold" th:text="${#numbers.formatInteger(p.amount, 1, 'NONE')} + ' ₽'"></td>
            </tr>
            <tr th:if="${payments.isEmpty()}"><td colspan="4" class="text-muted text-center">Ничего не найдено</td></tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${payments.totalPages > 1}" aria-label="Постраничная навигация" class="mt-3">
        <ul class="pagination pagination-lg justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${payments.first} ? 'disabled'">
                <a class="page-link" th:href="@{/payments(page=${payments.number - 1}, year=${year}, month=${month})}">← Назад</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, payments.number - 2), T(java.lang.Math).min(payments.totalPages - 1, payments.number + 2))}"
                th:classappend="${i == payments.number} ? 'active'">
                <a class="page-link" th:href="@{/payments(page=${i}, year=${year}, month=${month})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${payments.last} ? 'disabled'">
                <a class="page-link" th:href="@{/payments(page=${payments.number + 1}, year=${year}, month=${month})}">Вперёд →</a>
            </li>
        </ul>
        <p class="text-center text-muted small mb-0">
            Страница <span th:text="${payments.number + 1}"></span> из <span th:text="${payments.totalPages}"></span>
        </p>
    </nav>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/clickable-rows.js}" defer></script>
</body>
</html>
