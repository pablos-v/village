spring:
  application:
    name: village
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:dummy-bootstrap-key}
      base-url: https://openrouter.ai/api
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.default_schema: village
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: village
    liquibase-schema: public
    parameters:
      ai.role.password: ${AI_ROLE_PASSWORD:village_ai_dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10

app:
  ai-datasource:
    url: ${SPRING_AI_DATASOURCE_URL}
    username: ${SPRING_AI_DATASOURCE_USERNAME}
    password: ${SPRING_AI_DATASOURCE_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
